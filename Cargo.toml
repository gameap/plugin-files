[package]
name = "files"
version = "0.7.0"
edition = "2024"
license = "MIT"
publish = false
description = "GameAP plugin: manage the gameap-files FTP/SFTP daemon on nodes (users, access rules, virtual paths, SSH keys)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gameap-plugin-sdk = { path = "../gameap-proto/rust/gameap-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

[workspace]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
