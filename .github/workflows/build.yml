name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ref of gameap/gameap providing web/plugin-sdk; pin to a SHA if the SDK drifts
  # from frontend/package-lock.json
  GAMEAP_REF: main
  # Ref of gameap/gameap-proto providing rust/gameap-plugin-sdk; pin to a SHA if
  # the SDK drifts from Cargo.lock. Pinned to the head of the proto-updates
  # branch: HTTPResponse.file / FileRef, which src/http.rs sets, is not on main
  # yet. Restore `main` once proto-updates is merged.
  GAMEAP_PROTO_REF: aba9a6c002358ed56691ff1f5c28d448e5f2cdee

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin-files

      - uses: ./plugin-files/.github/actions/build-wasm
        with:
          gameap-ref: ${{ env.GAMEAP_REF }}
          gameap-proto-ref: ${{ env.GAMEAP_PROTO_REF }}
          plugin-path: plugin-files

      - uses: actions/upload-artifact@v4
        with:
          name: files-wasm
          path: plugin-files/files.wasm

  # The e2e suite itself only runs nightly, so this compiles it on every change
  # to keep it from rotting in between.
  e2e-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Compile the e2e suite
        working-directory: e2e
        env:
          E2E_ADMIN_PASSWORD: compile-only
          E2E_NODE_OS: linux
          E2E_NODE_HOST: 127.0.0.1
          E2E_NODE_WORK_PATH: /srv/gameap
          E2E_WASM_PATH: /dev/null
        run: |
          npm ci
          npx tsc --noEmit
          npx playwright test --list
